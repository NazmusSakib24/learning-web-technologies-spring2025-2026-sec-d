<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            /* height: 500px; */
            /* background-color: bisque; */
        }
        label{
                display: inline-block;
                width: 140px;
            }
    </style>
</head>
<body>
    <div class="container">
        <fieldset style="width: 500px; background-color:bisque;">
        <legend><h2>REGISTRATION</h2></legend>
        <form action="val.php" method="post">
            
            <label>Name</label>:
            <input type="text" name="name">
            
            <br><br><hr>
            
            <label>Email</label>:          
            <input type="text" name="email">
            
            <br><br><hr>

            <label>Username</label>:
            <input type="text" name="username" > 
            
            <br><br><hr>
            
            <label>Password</label>:
            <input type="password" name="password" >
        
            <br><br><hr>
            
            <label>Confirm Password</label>:
            <input type="password" name="con_pass">
            
            <br><br><hr>
            
            <fieldset>
                <legend>Gender</legend>
                <input type="radio" name="gender" value="Male">Male
                <input type="radio" name="gender" value="Female">Female
                <input type="radio" name="gender" value="Other">Other    
            </fieldset>
            <br><br><hr>
            
            <fieldset>
                <legend>Date of Birth</legend>
                <input type="date" name="dob">
                <br>
                <small><i>dd/mm/yy</i></small>
            </fieldset>
            <br><hr>
            
            <button type="submit" name="submit" style="background-color: aqua;">Submit</button>
            <button type="reset" name="reset" style="background-color: aquamarine;">Reset</button>
        
        </form>
    </fieldset>
    </div>
</body>
</html>
